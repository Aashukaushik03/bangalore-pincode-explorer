<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bangalore Pincode Explorer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <h1>Bangalore Pincode Explorer</h1>

    <div class="card">
      <h2>Search By Pincode</h2>

      <input type="text" id="pincodeInput" placeholder="Enter Pincode">

      <button onclick="searchPincode()">Search</button>

      <div id="pincodeResult"></div>
    </div>

    <div class="card">
      <h2>Search By Area Name</h2>

      <input type="text" id="areaInput" placeholder="Enter Area Name">

      <button onclick="searchArea()">Search</button>

      <div id="areaResult"></div>
    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
